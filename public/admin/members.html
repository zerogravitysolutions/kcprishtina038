<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Members · KÇ Prishtina 038 Admin</title>
<link rel="icon" href="../assets/logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..125,400..900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="page-content">
  <div class="page-head">
    <div>
      <h1>Members</h1>
      <div class="sub" data-bind="page-sub">…</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost">Export CSV</button>
      <button class="btn btn-ember">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Add member
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <span style="font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-right:6px;">Section</span>
    <button class="chip active" data-section="all">All · <span data-bind="sec-all">—</span></button>
    <button class="chip" data-section="road">Road · <span data-bind="sec-road">—</span></button>
    <button class="chip" data-section="mtb">MTB · <span data-bind="sec-mtb">—</span></button>
    <button class="chip" data-section="gravel">Gravel · <span data-bind="sec-gravel">—</span></button>
    <button class="chip" data-section="track">Track · <span data-bind="sec-track">—</span></button>
    <button class="chip" data-section="youth">Youth · <span data-bind="sec-youth">—</span></button>
    <button class="chip" data-section="women">Women's · <span data-bind="sec-women">—</span></button>
    <span class="spacer"></span>
    <span style="font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-right:6px;">Status</span>
    <button class="chip">Active</button>
    <button class="chip">Unpaid · 9</button>
    <button class="chip">Overdue · 2</button>
  </div>

  <!-- Table -->
  <div class="table-wrap" style="border-radius: 0 0 0 0;">
    <table class="t">
      <thead>
        <tr>
          <th style="width: 24px;"><input type="checkbox" /></th>
          <th>Rider</th>
          <th>Section</th>
          <th>Category</th>
          <th>Joined</th>
          <th>Dues</th>
          <th>Status</th>
          <th class="right">Actions</th>
        </tr>
      </thead>
      <tbody id="members-tbody">
        <tr><td colspan="8" style="padding:18px;color:var(--ink-3);font-family:var(--font-mono);font-size:12px;">Po ngarkohet…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="_shell.js"></script>
<script>
  renderShell({
    page: "members",
    crumbs: [{ label: "Admin", href: "dashboard.html" }, { label: "Members" }]
  });
</script>
<script type="module">
import { supa, boot, escapeHtml, initials } from "./admin.js";

const profile = await boot(["admin","editor","staff","coach"]);
const tbody = document.getElementById("members-tbody");
const set = (k, v) => document.querySelectorAll(`[data-bind="${k}"]`).forEach(el => el.textContent = v);
let currentSection = "all";

async function loadCounts() {
  const { data } = await supa.from("profiles").select("section_id, sections:section_id(slug)");
  const counts = { all: 0, road:0, mtb:0, gravel:0, track:0, youth:0, women:0 };
  (data || []).forEach(r => {
    counts.all++;
    const slug = r.sections?.slug;
    if (slug && counts.hasOwnProperty(slug)) counts[slug]++;
  });
  Object.entries(counts).forEach(([k, v]) => set(`sec-${k}`, v));
  set("page-sub", `${counts.all} në bazë`);
}

async function loadList() {
  let q = supa.from("profiles")
    .select("id, full_name, email, role, status, joined_at, section:sections(slug, name_sq)")
    .order("joined_at", { ascending: false, nullsFirst: false });
  if (currentSection !== "all") q = q.eq("section.slug", currentSection);
  const { data, error } = await q;
  if (error) { tbody.innerHTML = `<tr><td colspan="8" style="padding:16px;color:#9B4220;font-family:'JetBrains Mono',monospace;">${escapeHtml(error.message)}</td></tr>`; return; }
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="padding:18px;color:var(--ink-3);font-family:var(--font-mono);font-size:12px;">Nuk ka anëtarë.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(m => `
    <tr>
      <td><input type="checkbox" /></td>
      <td>
        <div class="person">
          <div class="avatar">${initials(m.full_name)}</div>
          <div class="nm">${escapeHtml(m.full_name)}<small>${escapeHtml(m.email)}</small></div>
        </div>
      </td>
      <td>${m.section ? `<span class="tag-sec ${escapeHtml(m.section.slug)}">${escapeHtml(m.section.name_sq)}</span>` : '<span class="mono" style="color:var(--ink-3);">—</span>'}</td>
      <td class="mono">${escapeHtml(m.role[0].toUpperCase() + m.role.slice(1))}</td>
      <td class="mono">${m.joined_at ? new Date(m.joined_at).toLocaleDateString("sq", { month: "short", year: "numeric" }) : "—"}</td>
      <td><span class="mono" style="color:var(--ink-3);font-size:11px;">—</span></td>
      <td><span class="badge-st ${m.status === 'active' ? 'ok' : m.status === 'pending' ? 'warn' : 'err'}">${escapeHtml(m.status)}</span></td>
      <td class="right actions">
        <a class="btn btn-sm btn-ghost" href="member-detail.html?id=${encodeURIComponent(m.id)}">Open</a>
      </td>
    </tr>
  `).join("");
}

document.querySelectorAll(".filter-bar .chip[data-section]").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".filter-bar .chip[data-section]").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentSection = chip.dataset.section;
    loadList();
  });
});

await Promise.all([loadCounts(), loadList()]);
</script>
</body>
</html>
