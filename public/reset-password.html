<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reseto fjalëkalimin · KÇ Prishtina 038</title>
<link rel="icon" href="assets/logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..125,400..900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css" />
<style>
  body { background: var(--paper); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }
  .reset-card {
    max-width: 440px; width: 100%;
    background: var(--white);
    border: 1px solid color-mix(in oklab, var(--ink) 10%, transparent);
    border-radius: 14px;
    padding: 36px;
  }
  .reset-card .brand {
    display: flex; align-items: center; gap: 12px; margin-bottom: 28px;
  }
  .reset-card .brand img { width: 36px; height: 36px; border-radius: 999px; }
  .reset-card h1 {
    font-family: var(--font-display); font-weight: 700;
    font-size: 28px; letter-spacing: -0.025em; margin: 0;
  }
  .reset-card .sub { margin-top: 8px; font-size: 14.5px; color: var(--ink-2); }
  .reset-card .field { margin-top: 20px; }
  .reset-card label {
    font-family: var(--font-mono); font-size: 10.5px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
    display: block; margin-bottom: 6px;
  }
  .reset-card input {
    width: 100%; font-family: var(--font-body); font-size: 14.5px;
    padding: 11px 14px; border-radius: 8px;
    border: 1px solid color-mix(in oklab, var(--ink) 18%, transparent);
    background: var(--white); color: var(--ink);
  }
  .reset-card input:focus { outline: 2px solid var(--ember); border-color: var(--ember); }
  .reset-card .btn { width: 100%; justify-content: center; margin-top: 22px; }
  .reset-card #msg {
    display: none; margin-top: 16px; padding: 10px 12px;
    border-radius: 8px; font-size: 13px;
  }
  .reset-card #msg.ok { background: color-mix(in oklab,#6FAAA8 18%,white); color: #0F1A2E; border: 1px solid color-mix(in oklab,#6FAAA8 36%,transparent); }
  .reset-card #msg.err { background: color-mix(in oklab,var(--ember) 12%,white); color: var(--ember-deep); border: 1px solid color-mix(in oklab,var(--ember) 28%,transparent); }
</style>
</head>
<body>

<div class="reset-card">
  <div class="brand">
    <img src="assets/logo.jpg" alt="" />
    <div>
      <div style="font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-0.015em;">KÇ Prishtina 038</div>
      <div style="font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;">Reseto fjalëkalimin</div>
    </div>
  </div>

  <h1>Vendos fjalëkalim të ri.</h1>
  <p class="sub">Fjalëkalimi duhet të jetë të paktën 8 karaktere.</p>

  <form id="reset-form">
    <div class="field">
      <label>Fjalëkalimi i ri</label>
      <input type="password" id="new-pw" minlength="8" required autocomplete="new-password" />
    </div>
    <div class="field">
      <label>Konfirmo fjalëkalimin</label>
      <input type="password" id="new-pw-confirm" minlength="8" required autocomplete="new-password" />
    </div>
    <button class="btn btn-ember" type="submit" id="submit-btn">
      <span>Ruaj fjalëkalimin</span>
      <svg class="arrow" viewBox="0 0 14 14" fill="none"><path d="M3 11 L11 3 M11 3 H5 M11 3 V9" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div id="msg"></div>
  </form>
</div>

<script type="module">
import { supa } from "./assets/supabase.js";

const msg  = document.getElementById("msg");
const btn  = document.getElementById("submit-btn");
const form = document.getElementById("reset-form");

function show(text, kind) { msg.textContent = text; msg.className = kind; msg.style.display = "block"; }

// Supabase puts the recovery token in the URL hash; the client picks it up
// automatically via detectSessionInUrl. Wait a tick before checking session.
await new Promise(r => setTimeout(r, 200));
const { data: { session } } = await supa.auth.getSession();
if (!session) {
  show("Linku është skaduar ose i pavlefshëm. Kërkoni një link të ri nga faqja e identifikimit.", "err");
  btn.disabled = true;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw  = document.getElementById("new-pw").value;
  const pw2 = document.getElementById("new-pw-confirm").value;
  if (pw !== pw2) { show("Fjalëkalimet nuk përputhen.", "err"); return; }

  btn.disabled = true;
  btn.querySelector("span").textContent = "Po ruan…";
  const { error } = await supa.auth.updateUser({ password: pw });
  btn.disabled = false;
  btn.querySelector("span").textContent = "Ruaj fjalëkalimin";

  if (error) { show("Gabim: " + error.message, "err"); return; }
  show("Fjalëkalimi u ndryshua. Ridrejtim te identifikimi…", "ok");
  setTimeout(() => { window.location.href = "login.html"; }, 1500);
});
</script>

</body>
</html>
